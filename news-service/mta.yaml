_schema-version: "3.1"
ID: news-dashboard
version: 1.0.0
description: Breaking Science & Tech News Dashboard

modules:
  - name: news-service-srv
    type: nodejs
    path: .
    parameters:
      buildpack: nodejs_buildpack
      memory: 256M
    build-parameters:
      builder: npm
      build-result: .
      commands:
        - npm install
        - cd ui && npm install && npm run build && cd ..
        - npx cds deploy --to sqlite
    provides:
      - name: news-service-api
        properties:
          url: ${default-url}

resources:
  - name: news-service-db
    type: org.cloudfoundry.managed-service
    parameters:
      service: sqlite
      service-plan: default
